name: Taipei VD collector

# 運作方式
# 1. 每次執行連續抓約5.5小時（每10分鐘一次），在6小時上限前留30分鐘餘裕。
# 2. 結束時自動觸發下一次執行（接力）；執行未滿30分鐘就結束時不接力，避免出錯時無限重跑。
#    所有對GitHub的上傳與指令都有時間上限，單次卡住不會拖垮整個迴圈。
# 3. 每小時的排程只是備援，接力中斷時由它重新啟動。
# 要停止收集：Actions頁面選這個workflow，右上角「...」→ Disable workflow。
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # 建立Release、上傳檔案
  actions: write    # 觸發下一次執行

concurrency:
  group: vd-collector
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BASE: https://tcgbusfs.blob.core.windows.net/blobtisv
      LOOP_MINUTES: "330"
      INTERVAL_SECONDS: "600"
      MIN_BYTES: "10000"
    steps:
      - name: Record start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Collect VD snapshots in a loop
        timeout-minutes: 340   # 這一步若超時只會讓此步失敗，下一步的接力仍會執行
        run: |
          set -uo pipefail
          END=$(( JOB_START + LOOP_MINUTES*60 ))
          fetch() {  # $1=遠端檔名 $2=本機檔名
            curl -fsS --retry 3 --retry-delay 10 --max-time 60 -o "$2" "$BASE/$1" \
              && gzip -t "$2" \
              && [ "$(stat -c %s "$2")" -ge "$MIN_BYTES" ] \
              || { echo "::warning::$1 failed or too small"; rm -f "$2"; }
          }
          while [ "$(date +%s)" -lt "$END" ]; do
            START=$(date +%s)
            TS=$(TZ=Asia/Taipei date +%Y%m%d_%H%M)
            DAY=${TS%_*}
            rm -rf out && mkdir -p out
            fetch GetVDDATA.xml.gz "out/VDDATA_${TS}.xml.gz"     # 車道層級
            fetch GetVD.xml.gz     "out/VDSECTION_${TS}.xml.gz"  # 路段層級
            if ls out/*.gz >/dev/null 2>&1; then
              timeout 60 gh release view "vd-$DAY" >/dev/null 2>&1 || \
                timeout 60 gh release create "vd-$DAY" --title "VD $DAY" \
                   --notes "Taipei City VD snapshots (Asia/Taipei date $DAY)" || true
              # 每個檔案分開上傳；單次上傳最多2分鐘，卡住就放棄重來（避免整個迴圈卡死）
              for f in out/*.gz; do
                for i in 1 2 3; do
                  timeout 120 gh release upload "vd-$DAY" "$f" --clobber && break
                  echo "::warning::upload retry $i for $f"; sleep 10
                done
              done
              echo "saved $TS"
            fi
            # 睡到下一個10分鐘，但不超過結束時間
            NOW=$(date +%s)
            SLEEP=$(( INTERVAL_SECONDS - (NOW - START) ))
            LEFT=$(( END - NOW ))
            [ "$SLEEP" -gt "$LEFT" ] && SLEEP=$LEFT
            if [ "$SLEEP" -gt 0 ]; then sleep "$SLEEP"; fi
          done
          exit 0

      - name: Chain next run
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - JOB_START ))
          if [ "$ELAPSED" -lt 1800 ]; then
            echo "::warning::Run lasted only ${ELAPSED}s; not chaining. Hourly schedule will retry."
            exit 0
          fi
          for i in 1 2 3; do
            timeout 60 gh workflow run vd.yml --ref "${{ github.ref_name }}" && echo "next run dispatched" && exit 0
            sleep 20
          done
          echo "::error::Failed to dispatch next run"; exit 1
